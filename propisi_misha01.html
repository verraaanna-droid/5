<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Книга крафта иероглифов — уроки 1–2</title>
<style>
:root{--dirt:#7a5230;--dirt2:#5e3d22;--grass:#5fa343;--grass2:#3f7a2b;--stone:#8b8b8b;--stone2:#5d5d5d;--paper:#f3ead3;--ink:#2a2018;--red:#c0392b;--gold:#f2c94c;--bg:#2b2118}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.px{font-family:"Courier New",Consolas,monospace;font-weight:700;letter-spacing:.5px}
header{background:var(--dirt);border-bottom:6px solid var(--grass);padding:14px 16px 10px;color:#fff}
header h1{margin:0;font-size:22px;text-shadow:2px 2px 0 #000}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
nav{display:flex;gap:6px;padding:10px 12px;background:var(--dirt2);position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{flex:1 0 auto;border:3px solid #000;background:var(--stone);color:#fff;padding:8px 12px;font:700 14px "Courier New",monospace;cursor:pointer;box-shadow:inset -3px -3px 0 var(--stone2),inset 3px 3px 0 #bbb}
nav button.on{background:var(--grass);box-shadow:inset -3px -3px 0 var(--grass2),inset 3px 3px 0 #9ad87c}
main{max-width:860px;margin:0 auto;padding:14px 16px 60px}
.panel{background:var(--paper);border:4px solid #000;box-shadow:inset -4px -4px 0 #c9bb97,inset 4px 4px 0 #fff8e1;padding:14px;margin-bottom:14px}
.hint{font-size:14px;color:#4a3d2d}
h2{margin:0 0 8px;font-size:18px}
.btn{border:3px solid #000;background:var(--grass);color:#fff;padding:9px 14px;font:700 14px "Courier New",monospace;cursor:pointer;box-shadow:inset -3px -3px 0 var(--grass2),inset 3px 3px 0 #9ad87c;margin:3px 4px 3px 0}
.btn.gr{background:var(--stone);box-shadow:inset -3px -3px 0 var(--stone2),inset 3px 3px 0 #bbb}
.btn.rd{background:var(--red);box-shadow:inset -3px -3px 0 #8e2a20,inset 3px 3px 0 #ef8b80}
.btn:active{transform:translateY(2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin:8px 0}
.cell{border:3px solid #000;background:#fff;text-align:center;font-size:26px;padding:4px 0;cursor:pointer;font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.cell.cur{outline:3px solid var(--gold)}
.cell.done{background:#bfe8a8}
.card{display:flex;flex-wrap:wrap;gap:14px}
.big{width:200px;height:200px;border:3px solid #000;background:#fff;flex:none;margin:0 auto}
.info{flex:1 1 240px;min-width:0}
.py{font-size:26px;color:var(--red);font-weight:800}
.ru{font-size:17px;font-weight:700}
.recipe{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.blk{border:3px solid #000;background:#fff;padding:4px 8px;text-align:center;min-width:60px}
.blk b{display:block;font-size:30px;font-family:"Noto Serif SC","Songti SC","SimSun",serif;line-height:1.1}
.blk small{font-size:11px;color:#555}
.op{font:800 22px "Courier New",monospace}
.res{background:var(--gold)}
.story{background:#e4f3d8;border-left:6px solid var(--grass);padding:8px 10px;font-size:15px}
.word{margin-top:8px;font-size:15px}
.zh{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.bar{height:16px;border:3px solid #000;background:#fff;margin:6px 0}
.bar i{display:block;height:100%;background:var(--grass);width:0}
.q{font-size:18px;margin:6px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opts button{border:3px solid #000;background:#fff;padding:10px;font-size:20px;cursor:pointer;font-family:"Noto Serif SC","Songti SC",system-ui,serif}
.opts button.ok{background:#8fdc6d}.opts button.no{background:#f19a90}
.fb{min-height:24px;font-weight:700;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:2px solid #000;padding:5px 7px;text-align:left}th{background:var(--dirt);color:#fff}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}.stats span{background:#fff;border:3px solid #000;padding:2px 10px}
@media(max-width:480px){.big{width:170px;height:170px}.py{font-size:22px}}

.lvl{margin-top:8px;font-size:13px}.lvl .bar{background:#3b2a1a;margin:4px 0 0;height:12px;border-color:#000}.lvl .bar i{background:var(--gold)}
.pill{display:inline-block;border:2px solid #000;background:#fff;padding:1px 8px;font-size:12px;margin-left:6px}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.slot{width:74px;height:74px;border:4px solid #000;background:#c6c6c6;box-shadow:inset 3px 3px 0 #8b8b8b,inset -3px -3px 0 #fff;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:8px 0}
.inv button{border:3px solid #000;background:#fff;padding:6px 2px;cursor:pointer;font-size:30px;line-height:1.1;font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.inv button small{display:block;font:11px system-ui;color:#555}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .5s}@keyframes pp{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
canvas.pad{border:3px solid #000;background:#fff;touch-action:none;max-width:100%;width:280px;height:280px;cursor:crosshair}
.pal{display:flex;gap:6px;margin:6px 0}.pal i{width:28px;height:28px;border:3px solid #000;cursor:pointer;display:inline-block}.pal i.on{outline:3px solid var(--gold)}
textarea{width:100%;border:3px solid #000;padding:8px;font:15px system-ui;min-height:70px;background:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.gal div{border:3px solid #000;background:#fff;padding:6px;font-size:13px}.gal img{width:100%;display:block;border:1px solid #999}
.seg{display:flex;gap:6px;margin:4px 0 8px;flex-wrap:wrap}.cell.l1{background:#fff3cf}.cell.l2{background:#dcecff}.cell.done{background:#bfe8a8}.em{font-size:18px;display:block;line-height:1}.lf button{padding:6px 10px}.tk td,.tk th{text-align:center}.tk td:first-child,.tk th:first-child{text-align:left}.tk input{width:22px;height:22px}
.chk li{margin:4px 0}
</style></head><body>
<header><h1 class="px">⛏ Книга крафта иероглифов</h1>
<p>Урок 1 婚礼的颜色 · Цвета свадьбы &nbsp;|&nbsp; Урок 2 不同的节日 · Разные праздники &nbsp;·&nbsp; все иероглифы и слова — из твоих прописей</p></header><div id="lvl" style="background:var(--dirt2);color:#fff;padding:6px 16px 10px"></div>
<div id="lf" style="background:#3b2a1a;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div><nav id="nav"></nav>
<main id="app"></main>

ону", "🪟"]], "story": "Рот кричит в окно на всю улицу — громко звучит! (向 похож на дом с окошком.)", "strokes": 9, "lesson": 1, "grp": "w"}, {"ch": "新", "py": "xīn", "ru": "новый", "word": "新郎", "wordpy": "xīnláng", "wordru": "жених", "blocks": [["亲", "дерево на земле", "🌳"], ["斤", "топор", "🪓"]], "story": "Срубил топором дерево — получил новые, свежие брёвна. Как первые блоки дерева в новом мире.", "strokes": 13, "lesson": 1, "grp": "w"}, {"ch": "郎", "py": "láng", "ru": "парень, жених", "word": "新郎", "wordpy": "xīnláng", "wordru": "жених", "blocks": [["良", "хороший", "👍"], ["阝", "город (справа)", "🏘️"]], "story": "Хороший парень из города — жених. Сравни с 娘: у них общая «хорошая» половинка 良.", "strokes": 8, "lesson": 1, "grp": "w"}, {"ch": "娘", "py": "niáng", "ru": "девушка, невеста", "word": "新娘", "wordpy": "xīnniáng", "wordru": "невеста", "blocks": [["女", "женщина", "👩"], ["良", "хорошая", "👍"]], "story": "Хорошая девушка — невеста. У жениха 良 слева, у невесты справа: они стоят лицом друг к другу.", "strokes": 10, "lesson": 1, "grp": "w"}, {"ch": "恭", "py": "gōng", "ru": "почтительно", "word": "恭喜", "wordpy": "gōngxǐ", "wordru": "поздравлять", "blocks": [["共", "вместе", "🤝"], ["⺗", "сердце", "❤️"]], "story": "Все вместе и от всего сердца — почтительно поздравляем. Внизу сердце 心 «приплюснуто», чтобы поместиться.", "strokes": 10, "lesson": 1, "grp": "w"}, {"ch": "喜", "py": "xǐ", "ru": "радость", "word": "恭喜", "wordpy": "gōngxǐ", "wordru": "поздравлять", "blocks": [["壴", "барабан", "🥁"], ["口", "рот", "😄"]], "story": "Барабан на ножках бьёт, а рот внизу поёт — радость! Двойная радость 囍 висит на каждой китайской свадьбе.", "strokes": 12, "lesson": 1, "grp": "w"}, {"ch": "庆", "py": "qìng", "ru": "праздновать", "word": "庆祝", "wordpy": "qìngzhù", "wordru": "праздновать", "blocks": [["广", "навес", "⛺"], ["大", "большой", "🙌"]], "story": "Под навесом человек широко раскинул руки (大) — у нас праздник!", "strokes": 6, "lesson": 1, "grp": "w"}, {"ch": "祝", "py": "zhù", "ru": "желать", "word": "庆祝", "wordpy": "qìngzhù", "wordru": "праздновать", "blocks": [["礻", "алтарь", "⛩️"], ["兄", "человек с большим ртом", "🗣️"]], "story": "Человек с огромным ртом стоит у алтаря и громко произносит пожелания. 礻 слева — всё про духов и удачу.", "strokes": 9, "lesson": 1, "grp": "w"}, {"ch": "事", "py": "shì", "ru": "дело, событие", "word": "喜事", "wordpy": "xǐshì", "wordru": "радостное событие", "blocks": [["事", "рука держит палку с табличкой", "📋"]], "story": "Одна длинная палка 亅 пронзает весь иероглиф, на ней табличка 口 и рука 彐. Как столб с квестом: «вот тебе дело!»", "strokes": 8, "lesson": 1, "grp": "w"}, {"ch": "表", "py": "biǎo", "ru": "выражать; снаружи", "word": "表示", "wordpy": "biǎoshì", "wordru": "выражать, означать", "blocks": [["龶", "шерсть", "🐑"], ["衣", "одежда", "👕"]], "story": "Шерсть снаружи одежды — её всем видно. Поэтому 表 — «показывать, выражать».", "strokes": 8, "lesson": 1, "grp": "w"}, {"ch": "示", "py": "shì", "ru": "показывать", "word": "表示", "wordpy": "biǎoshì", "wordru": "выражать, означать", "blocks": [["二", "плита алтаря", "🪨"], ["小", "ножки", "🦵"]], "story": "Это алтарь: сверху плита, внизу ножки. На алтаре показывают дары. Слева в других иероглифах он сжимается в 礻.", "strokes": 5, "lesson": 1, "grp": "w"}, {"ch": "蜡", "py": "là", "ru": "воск", "word": "蜡烛", "wordpy": "làzhú", "wordru": "свеча", "blocks": [["虫", "насекомое", "🐝"], ["昔", "давным-давно", "⏳"]], "story": "Пчёлы (насекомые) давным-давно делают воск. Из воска — свечи.", "strokes": 14, "lesson": 1, "grp": "w"}, {"ch": "烛", "py": "zhú", "ru": "свеча", "word": "蜡烛", "wordpy": "làzhú", "wordru": "свеча", "blocks": [["火", "огонь", "🔥"], ["虫", "червячок", "🐛"]], "story": "Огонёк на червячке-фитиле — свеча. 蜡 и 烛 оба с жуком 虫, запомни парой.", "strokes": 10, "lesson": 1, "grp": "w"}, {"ch": "墙", "py": "qiáng", "ru": "стена", "word": "墙", "wordpy": "qiáng", "wordru": "стена", "blocks": [["土", "земля", "🟫"], ["啬", "амбар", "🏚️"]], "story": "Из блоков земли строим стену  shuffle([q.a,...q.w]).forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{[...document.querySelectorAll('#o button')].forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});
  if(o===q.a){T.ok++;$('#fb').textContent='⛏ Верно!'}else{b.classList.add('no');$('#fb').textContent='Правильно: '+q.a;T.wrong.push(q.q.replace(/<[^>]+>/g,'')+' → '+q.a)}
  const n=el('<button class="btn" style="margin-top:8px">Дальше →</button>');n.onclick=()=>{T.i++;VIEWS.test()};$('#fb').after(n)};$('#o').appendChild(b)});}
/* ---------- Книга ---------- */
VIEWS.book=function(){const a=$('#app');a.innerHTML='';
 const row=w=>`<tr><td class="zh" style="font-size:18px">${w[0]}</td><td>${w[1]}</td><td>${w[2]}</td></tr>`;
 const L1=WORDS.filter(w=>w[3]===1),L2=WORDS.filter(w=>w[3]===2);
 a.appendChild(el(`<div class="panel"><h2 class="px">Урок 1 · 婚礼的颜色 · Цвета свадьбы</h2><table><tr><th>Слово</th><th>Пиньинь</th><th>Перевод</th></tr>${L1.map(row).join('')}</table><h2 class="px" style="margin-top:12px">Урок 2 · 不同的节日 · Разные праздники</h2><table><tr><th>Слово</th><th>Пиньинь</th><th>Перевод</th></tr>${L2.map(row).join('')}</table></div>`));
 a.appendChild(el(`<div class="panel"><h2 class="px">Как выучить иероглиф наизусть</h2><ol class="chk"><li><b>Разбери на блоки.</b> Назови части вслух: «огонь + гвоздь = фонарь».</li><li><b>Придумай свою историю.</b> Смешная и странная запоминается лучше. Нарисуй её.</li><li><b>Пиши по памяти с нуля.</b> Не смотри на образец, пока не вспомнишь всё. Подсмотрел, значит, повтори.</li><li><b>Говори вслух.</b> Каждый раз: пиньинь, значение, блоки.</li><li><b>Повторяй с интервалами.</b> День 1, 2, 4 и 7 (и ещё раз перед тестом) — отмечай в «Трекере». «Диктант» сам напомнит в «Миссии дня».</li><li><b>Тренируй скорость.</b> Цель: написать иероглиф за 10 секунд без ошибок.</li></ol></div>`));
 a.appendChild(el(`<div class="panel"><div class="hint">Здесь только иероглифы и слова из твоих прописей (уроки 1–2). Ничего лишнего.</div></div>`));}
let trk=LS.get('pr_track',{});
VIEWS.track=function(){const a=$('#app');a.innerHTML='';
 const W=WF();const days=[1,2,4,7];let done=0;W.forEach(w=>days.forEach(d=>{if(trk[w[0]+'_'+d])done++}));
 a.appendChild(el(`<div class="panel"><h2 class="px">Трекер повторений</h2><div class="hint">Память работает как зелья: эффект кончается, если его не обновлять. Пиши слова по памяти в день 1, 2, 4 и 7 (и ещё раз перед тестом) и ставь ✓. Закрыто: <b>${done}</b> / ${W.length*4} (+3 XP за каждую отметку).</div><div class="bar"><i style="width:${done/(W.length*4)*100}%"></i></div></div>`));
 const rows=W.map(w=>`<tr><td><span class="zh" style="font-size:18px">${w[0]}</span> <small>${w[2]}</small></td>${days.map(d=>`<td><input type="checkbox" data-k="${w[0]}_${d}" ${trk[w[0]+'_'+d]?'checked':''}></td>`).join('')}</tr>`).join('');
 const p=el(`<div class="panel"><table class="tk"><tr><th>Слово</th><th>день 1</th><th>день 2</th><th>день 4</th><th>день 7</th></tr>${rows}</table></div>`);a.appendChild(p);
 p.querySelectorAll('input').forEach(i=>i.onchange=()=>{const k=i.dataset.k;if(i.checked){if(!trk[k])addXP(3);trk[k]=1}else delete trk[k];LS.set('pr_track',trk);VIEWS.track()});}
let LF=0,curV='bench';
const _show=show;show=function(id){curV=id;_show(id)};
function setLF(n){LF=n;CH=CHALL.filter(c=>!n||c.lesson===n);CRAFTABLE=CH.filter(c=>c.blocks.length>1);bi=ai=di=wi=wpos=wmist=0;cc=null;T=null;drawLF();show(curV)}
function drawLF(){const b=$('#lf');b.innerHTML='<span style="color:#fff;font:700 13px monospace">Показать:</span>';[[0,'Всё'],[1,'Урок 1'],[2,'Урок 2']].forEach(([n,tx])=>{const x=el(`<button class="btn ${LF===n?'':'gr'}" style="padding:5px 10px;margin:0">${tx}</button>`);x.onclick=()=>setLF(n);b.appendChild(x)})}
drawLF();
renderLvl();show('bench');
</script></body></html>
